server:
  port: 8082

app:
  storage:
    local-dir: ./uploads

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/nutrition?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Bangkok
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}
      # KHÔNG để /v1 ở đây, vì client sẽ tự append /v1/...
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: openai/gpt-4o-mini

logging:
  level:
    org.hibernate.SQL: debug
