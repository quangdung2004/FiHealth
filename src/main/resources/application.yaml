server:
  port: 8082

app:
  storage:
    local-dir: ./uploads

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/nutrition?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Bangkok
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}
      # KHÔNG để /v1 ở đây, vì client sẽ tự append /v1/...
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: openai/gpt-4o-mini
  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com
    password: your_app_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

logging:
  level:
    org.hibernate.SQL: debug
jwt:
  secret: a1b31e357b84889fbccfe46570e46aa3bcd90455b308e3eb65f3f5f4b7dde504
  access-token-expiration: 3600000      # Đã sửa từ 'expire' thành 'expiration'
  refresh-token-expiration: 604800000   # Mình khuyên sửa luôn cái này cho đồng bộ, kiểm tra lại code Java xem nó gọi tên là gì  # 7 days


